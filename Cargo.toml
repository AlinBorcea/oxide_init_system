[package]
name = "rise"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = {version = "0.2.190", default-features = false}

[[bin]]
name = "oxide"
path = "src/bin/oxide.rs"

[[bin]]
name = "daemonizer"
path = "src/bin/daemonizer.rs"

[profile.dev]
panic = "abort"     # Required for #![no_std] without custom panic unwinders

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link-Time Optimization
codegen-units = 1   # Maximize LTO optimization
panic = "abort"     # Required for #![no_std] without custom panic unwinders
strip = true        # Strip symbols from the binary
